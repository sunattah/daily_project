<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybook — New entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16202B;
    --panel: #1E2C3A;
    --paper: #EDE6D6;
    --muted: #8FA1B3;
    --line: #2C3E50;
    --amber: #E8A33D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .page {
    max-width: 520px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  header {
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 32px;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    margin: 0;
  }

  header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-top: 20px;
    margin-bottom: 6px;
  }

  input, textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--paper);
    padding: 10px 12px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 15px;
    color-scheme: dark;
  }

  textarea {
    resize: vertical;
    line-height: 1.5;
  }

  input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 1px;
  }

  .row {
    display: flex;
    gap: 16px;
  }

  .row > div {
    flex: 1;
  }

  button.submit {
    margin-top: 28px;
    background: var(--amber);
    color: var(--ink);
    border: none;
    padding: 12px 20px;
    border-radius: 4px;
    font-family: inherit;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }

  button.submit:hover {
    background: #f0b357;
  }

  button.submit:focus-visible {
    outline: 2px solid var(--paper);
    outline-offset: 2px;
  }

  .back-link {
    display: inline-block;
    margin-top: 24px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
  }

  .back-link:hover {
    color: var(--paper);
  }

  @media (max-width: 480px) {
    .page { padding: 32px 16px 60px; }
    .row { flex-direction: column; gap: 0; }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>New entry</h1>
      <p>Add something to the log</p>
    </header>

    <form method="post" action="/add">
      <div class="row">
        <div>
          <label for="date">Date</label>
          <input type="date" id="date" name="date" value="{{.Date}}" required>
        </div>
        <div>
          <label for="time">Time</label>
          <input type="time" id="time" name="time" required>
        </div>
      </div>

      <label for="description">What are you going to do?</label>
      <textarea id="description" name="description" rows="5" placeholder="Write it out — as much detail as you want." required></textarea>

      <button type="submit" class="submit">Save entry</button>
    </form>

    <a class="back-link" href="/?date={{.Date}}">Back to today's log</a>
  </div>
</body>
</html>
