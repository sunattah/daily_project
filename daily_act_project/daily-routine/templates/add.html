<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Activity</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; color: #222; }
        label { display: block; margin-top: 16px; font-weight: 600; }
        input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; }
        button { margin-top: 20px; padding: 10px 18px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
        a { display: inline-block; margin-top: 16px; color: #555; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Add Activity</h1>
    <form method="post" action="/add">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" value="{{.Date}}" required>

        <label for="time">Time</label>
        <input type="time" id="time" name="time" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="5" placeholder="What are you going to do?" required></textarea>

        <button type="submit">Save</button>
    </form>
    <a href="/?date={{.Date}}">← Back to today's list</a>
</body>
</html>
