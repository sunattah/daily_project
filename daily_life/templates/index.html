<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DailyLife</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <header>
        <div class="logo">
            DailyLife
        </div>

        <nav>
            <a href="/">Dashboard</a>
            <a href="#">Tasks</a>
            <a href="#">Schedule</a>
            <a href="#">Notes</a>
        </nav>
    </header>


    <main>

        <section class="welcome">
            <h1>Good morning! 👋</h1>
            <p>Let's make today productive.</p>
        </section>


        <section class="cards">

            <div class="card">
                <h2>Tasks</h2>
                <p class="number">0</p>
                <p>Tasks for today</p>
            </div>

            <div class="card">
                <h2>Schedule</h2>
                <p class="number">0</p>
                <p>Activities planned</p>
            </div>

            <div class="card">
                <h2>Progress</h2>
                <p class="number">0%</p>
                <p>Today's progress</p>
            </div>

        </section>


        <section class="activities">

            <h2>Today's Activities</h2>

            <div class="empty">
                <p>You don't have any activities yet.</p>

                <button>
                    Add Activity
                </button>
            </div>

        </section>

    </main>


    <footer>
        <p>DailyLife &copy; 2026</p>
    </footer>

    <script src="/static/js/app.js"></script>

</body>

</html>
