<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DailyLife - Notes</title>

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<header>

    <div class="logo">
        DailyLife
    </div>

    <nav>
        <a href="/">Dashboard</a>
        <a href="/schedule">Schedule</a>
        <a href="/notes">Notes</a>
    </nav>

</header>


<main>

    <section class="welcome">

        <h1>My Notes 📝</h1>

        <p>Write down your ideas and important information.</p>

    </section>


    <!-- ADD NOTE -->

    <section class="add-task">

        <h2>Create a Note</h2>

        <form action="/add-note" method="POST">

            <input
                type="text"
                name="title"
                placeholder="Note title"
                required
            >

            <textarea
                name="content"
                placeholder="Write your note here..."
                required
            ></textarea>

            <button type="submit">
                Save Note
            </button>

        </form>

    </section>


    <!-- NOTES -->

    <section class="tasks">

        <h2>Your Notes</h2>

        {{if .Notes}}

            {{range .Notes}}

            <article class="note">

                <h3>
                    {{.Title}}
                </h3>

                <p>
                    {{.Content}}
                </p>

                <form action="/delete-note" method="POST">

                    <input
                        type="hidden"
                        name="id"
                        value="{{.ID}}"
                    >

                    <button type="submit">
                        Delete
                    </button>

                </form>

            </article>

            {{end}}

        {{else}}

            <div class="empty">

                <p>
                    You don't have any notes yet.
                </p>

            </div>

        {{end}}

    </section>

</main>


<footer>

    <p>
        DailyLife &copy; 2026
    </p>

</footer>

</body>

</html>
