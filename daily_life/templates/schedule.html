<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DailyLife - Schedule</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<header>

    <div class="logo">
        DailyLife
    </div>

    <nav>
        <a href="/">Dashboard</a>
        <a href="/schedule">Schedule</a>
        <a href="#">Notes</a>
    </nav>

</header>


<main>

    <section class="welcome">

        <h1>Today's Schedule 📅</h1>

        <p>Plan your day and stay organized.</p>

    </section>


    <!-- ADD ACTIVITY -->

    <section class="add-task">

        <h2>Add Activity</h2>

        <form id="scheduleForm">

            <input
                type="time"
                id="time"
                required
            >

            <input
                type="text"
                id="activity"
                placeholder="What are you doing?"
                required
            >

            <button type="submit">
                Add Activity
            </button>

        </form>

    </section>


    <!-- SCHEDULE -->

    <section class="tasks">

        <h2>Schedule</h2>

        <div id="scheduleList">

            <p class="empty">
                No activities scheduled yet.
            </p>

        </div>

    </section>

</main>


<footer>

    <p>
        DailyLife &copy; 2026
    </p>

</footer>


<script src="/static/js/app.js"></script>

</body>

</html>
